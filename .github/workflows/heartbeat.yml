name: heartbeat
# GitHub disables scheduled workflows after 60 days without repository activity. A weekly commit keeps keepalive.yml alive.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"last heartbeat: %Y-%m-%dT%H:%MZ" > heartbeat.txt
          git config user.name "keepalive-bot"; git config user.email "keepalive-bot@users.noreply.github.com"
          git add heartbeat.txt; git commit -m "chore: heartbeat" || true; git push || true
